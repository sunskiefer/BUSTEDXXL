# KutilXXL: builds the plugin (armv7) and the skin, packages the release zip, checks it (catalog_check + `sh -n` on
# install.sh/uninstall.sh, the L'Cronx apostrophe). A v* tag push (or "Run workflow" with a version) publishes the GitHub release.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 0.1.0 (empty = build only)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools (Pillow, numpy, Zig, qemu)
        run: |
          python3 -m pip install --quiet pillow numpy ziglang
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
      - name: Build
        run: ./build.sh
      - name: Offline tests (ARM engine under qemu)
        run: bash test/run_tests.sh
      - name: Package
        run: |
          V="${{ inputs.version }}"; [ "$GITHUB_REF_TYPE" = tag ] && V="${GITHUB_REF_NAME#v}"; V="${V:-0.0.${GITHUB_RUN_NUMBER}}"; echo "VERSION=$V" >> "$GITHUB_ENV"
          python3 third_party/mpc-vst-plugins/tools/release.py --so build/arm/kutilxxl.so \
            --skin "build/package/L'Cronx - VST - KutilXXL" --entry build/pluginlist-entry.xml --version "$V" \
            --about "Groovebox of Bastl-style modules: Wave Bard on Bastl's open-source Kastle 2 DSP, imagined Kompas, Crust 2, Pizza, Alchemist, Basil and ABC, patched with touch cables" \
            --repo sunskiefer/BUSTEDXXL --license GPL-3.0-or-later --id kutilxxl -o dist
          python3 third_party/mpc-vst-plugins/tools/catalog_check.py dist/*.zip --catalog
      - name: Installer syntax (sh -n) and the L'Cronx apostrophe
        run: |
          set -e
          for z in dist/*.zip; do
            d=$(mktemp -d); unzip -q "$z" -d "$d"
            find "$d" \( -name install.sh -o -name uninstall.sh \) -print0 | while IFS= read -r -d '' s; do
              sh -n "$s" && echo "sh -n OK: $s"
            done
            n=$(find "$d" \( -name install.sh -o -name uninstall.sh \) | wc -l); [ "$n" -ge 2 ] || { echo "installer missing in $z"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: KutilXXL-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 30
      - name: Publish release (tag push v*, or Run workflow with a version)
        if: ${{ github.ref_type == 'tag' || inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: KutilXXL ${{ env.VERSION }}
          make_latest: true
          files: dist/*-mpc-armv7.zip
          body: "KutilXXL for Force / MPC OS by L'Cronx: a groovebox of Bastl-style modules patched with touch cables. Install: unzip, run install.sh (INSTALL.md inside), or use the MPC plugin installer. Tested offline only; not yet tested on a Force."
